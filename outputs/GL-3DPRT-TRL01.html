  <style>
    :root {
      color-scheme: dark;
      --bg: #2b2622;
      --panel: #383330;
      --panel-2: #312c28;
      --ink: #f7f5f0;
      --muted: #aea69c;
      --body: #c9c0ad;
      --line: #3f3a36;
      --accent: #f7f5f0;
      --accent-2: #b84d3a;
      --blue: #7aa4d8;
      --warn: #d59a45;
      --bad: #d76961;
      --shadow: 0 18px 46px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(360px, 430px) minmax(0, 1fr);
      height: 100vh;
      overflow: hidden;
    }

    aside {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 8px 14px;
      border-right: 1px solid var(--line);
      background: #2b2622;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: hidden;
    }

    main {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(247,245,240,0.035) 1px, transparent 1px),
        linear-gradient(0deg, rgba(247,245,240,0.035) 1px, transparent 1px),
        #312c28;
      background-size: 38px 38px;
    }

    @media (min-width: 861px) {
      main {
        position: sticky;
        top: 0;
        height: 100vh;
      }
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.18;
      font-weight: 760;
    }

    .subtitle {
      margin: 1px 0 0;
      color: var(--body);
      font-size: 11px;
      line-height: 1.28;
    }

    .section {
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 7px 10px;
      background: var(--panel);
      box-shadow: 0 1px 0 rgba(255,255,255,0.03);
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
      font-size: 13px;
      font-weight: 760;
      color: var(--ink);
    }

    .field {
      display: grid;
      grid-template-columns: 1fr 82px;
      align-items: center;
      gap: 7px;
      margin: 3px 0;
    }

    .nozzle-field select {
      grid-column: 2;
    }

    .nozzle-section {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
    }

    .nozzle-section .section-title,
    .nozzle-section .nozzle-field {
      margin: 0;
    }

    .nozzle-section .nozzle-field {
      display: block;
    }

    .nozzle-section .nozzle-field select {
      width: 148px;
    }

    .pose-section {
      display: block;
    }

    .pose-section .field {
      grid-template-columns: 88px minmax(0, 1fr);
    }

    .pose-section .value-pill,
    html[data-theme="camada"] .pose-section .value-pill {
      width: 100%;
      height: auto;
      min-height: 27px;
      padding: 4px 6px;
      white-space: normal;
      text-align: right;
      line-height: 1.15;
      font-size: 10.5px;
    }

    label {
      display: grid;
      gap: 2px;
      color: var(--ink);
      font-size: 11.5px;
      font-weight: 650;
    }

    label span {
      color: var(--muted);
      font-size: 10px;
      font-weight: 520;
    }

    input[type="number"] {
      width: 82px;
      height: 25px;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 0 8px;
      color: var(--ink);
      background: var(--panel-2);
      font: inherit;
      text-align: right;
    }

    select {
      width: 100%;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 0 8px;
      color: var(--ink);
      background: var(--panel-2);
      font: inherit;
    }

    .value-pill {
      width: 100%;
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 0 8px;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    input[type="range"] {
      grid-column: 1 / -1;
      width: 100%;
      height: 10px;
      accent-color: var(--accent);
    }

    .field.fit-field {
      grid-template-columns: 1fr 112px;
      row-gap: 13px;
      margin: 15px 0 17px;
    }

    .field.fit-field input[type="number"] {
      width: 112px;
    }

    .field.fit-field input[type="range"] {
      grid-column: 1 / 2;
    }

    .inline-fit {
      grid-column: 2 / 3;
      width: 100%;
      min-height: 36px;
      border-radius: 3px;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 900;
      line-height: 1.15;
      padding: 0 6px;
    }

    .inline-fit.active {
      border-color: rgba(247,245,240,0.34);
      background: rgba(247,245,240,0.1);
      color: var(--ink);
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      min-height: 28px;
      border: 1px solid var(--line);
      border-radius: 3px;
      color: var(--ink);
      background: var(--panel-2);
      font: inherit;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    button.primary {
      border-color: rgba(26, 127, 112, 0.32);
      background: var(--ink);
      color: var(--bg);
    }

    button:hover { filter: brightness(1.08); }

    input[type="file"] {
      display: none;
    }

    .file-button {
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 0 10px;
      color: var(--ink);
      background: var(--panel-2);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .stl-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .stl-actions .file-button {
      grid-column: 1 / -1;
    }

    .stl-actions #toggleStlIntersection {
      grid-column: 1 / -1;
    }

    .stl-name {
      margin-top: 7px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      word-break: break-word;
    }

    .stl-controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px 8px;
      margin-top: 9px;
    }

    .stl-control {
      display: grid;
      gap: 4px;
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.1;
    }

    .stl-control input[type="number"] {
      width: 100%;
      height: 28px;
      font-size: 13px;
    }

    .stl-control input[type="range"] {
      width: 100%;
      height: 12px;
      margin: 0;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 6px 9px;
      background: var(--panel-2);
      color: var(--body);
      font-size: 11.5px;
      line-height: 1.25;
    }

    .dot {
      flex: 0 0 auto;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
    }

    .status.invalid .dot { background: var(--bad); }
    .status.warning .dot { background: var(--warn); }

    .stl-range-warning {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 440px;
      border: 2px solid #ff3b30;
      border-radius: 3px;
      padding: 11px 13px;
      background: rgba(255,255,255,0.96);
      box-shadow: 0 2px 8px rgba(255,59,48,0.16);
      color: #c6281f;
      font-size: 12px;
      line-height: 1.35;
      pointer-events: none;
    }

    .stl-range-warning strong {
      color: #ff3b30;
      font-size: 14px;
      font-weight: 850;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .metric {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 6px 8px;
      background: var(--panel-2);
    }

    .metric b {
      display: block;
      font-size: 17px;
      line-height: 1.1;
      color: var(--ink);
    }

    .metric span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
    }

    #scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .chip {
      border: 1px solid rgba(23,33,31,0.12);
      border-radius: 4px;
      padding: 10px 12px;
      background: rgba(56,51,48,0.88);
      box-shadow: var(--shadow);
      color: var(--body);
      font-size: 12px;
      line-height: 1.4;
      backdrop-filter: blur(10px);
    }

    .view-controls {
      position: absolute;
      top: 18px;
      right: 18px;
      display: grid;
      grid-template-columns: auto auto;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(23,33,31,0.1);
      border-color: var(--line);
      border-radius: 4px;
      padding: 6px;
      background: rgba(56,51,48,0.82);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .view-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      line-height: 1;
      padding: 0 2px 0 4px;
    }

    .view-buttons {
      display: flex;
      gap: 0;
      overflow: hidden;
      border: 1px solid rgba(23,33,31,0.1);
      border-color: var(--line);
      border-radius: 3px;
      background: rgba(43,38,34,0.72);
    }

    .view-controls button {
      min-height: 32px;
      min-width: 46px;
      border: 0;
      border-radius: 0;
      padding: 0 11px;
      background: transparent;
      font-size: 12px;
      font-weight: 800;
      color: var(--ink);
      box-shadow: none;
    }

    .view-controls button + button {
      border-left: 1px solid rgba(23,33,31,0.1);
      border-left-color: var(--line);
    }

    .view-controls button:hover {
      background: rgba(247,245,240,0.08);
    }

    .fit-modes {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 4px;
    }

    .fit-modes button {
      min-height: 28px;
      border-radius: 3px;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      line-height: 1.15;
      padding: 0 6px;
    }

    .fit-modes button.active {
      border-color: rgba(247,245,240,0.34);
      background: rgba(247,245,240,0.1);
      color: var(--ink);
    }

    .fit-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 5px;
      margin-top: 8px;
    }

    .fit-actions button,
    .fit-modes button,
    .inline-fit {
      width: 100%;
      min-height: 28px;
    }

    .chip strong {
      display: block;
      margin-bottom: 2px;
      color: var(--ink);
      font-size: 13px;
    }

    @media (max-width: 860px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(560px, 1fr);
      }

      aside {
        max-height: 52vh;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        overflow-y: auto;
      }

      main { min-height: 560px; }
      .hud { flex-direction: column; }
    }

    @media (min-width: 861px) and (min-height: 840px) {
      aside {
        gap: 8px;
        padding: 12px 18px;
      }

      h1 {
        font-size: 20px;
      }

      .subtitle {
        margin-top: 3px;
        font-size: 12px;
        line-height: 1.36;
      }

      .section {
        padding: 10px 13px;
      }

      .section-title {
        margin-bottom: 7px;
        font-size: 14px;
      }

      .field {
        gap: 10px;
        margin: 6px 0;
      }

      .field.fit-field {
        row-gap: 14px;
        margin: 17px 0 19px;
      }

      label {
        gap: 3px;
        font-size: 12.5px;
      }

      label span {
        font-size: 11px;
      }

      input[type="number"] {
        height: 31px;
      }

      input[type="range"] {
        height: 17px;
      }

      button,
      .fit-actions button,
      .fit-modes button {
        min-height: 34px;
      }

      .fit-modes,
      .fit-actions {
        gap: 7px;
      }

      .fit-actions {
        margin-top: 10px;
      }

      .fit-modes {
        margin-bottom: 6px;
      }

      .metric {
        padding: 8px 10px;
      }

      .metric b {
        font-size: 22px;
      }

      .status {
        min-height: 38px;
        padding: 7px 11px;
        font-size: 12.5px;
      }
    }

    function chaikinOpenProfile(points, passes) {
      let result = points.map((point) => ({ ...point }));
      for (let pass = 0; pass < passes; pass += 1) {
        const next = [result[0]];
        for (let i = 0; i < result.length - 1; i += 1) {
          const a = result[i];
          const b = result[i + 1];
          next.push(
            { r: a.r * 0.75 + b.r * 0.25, z: a.z * 0.75 + b.z * 0.25 },
            { r: a.r * 0.25 + b.r * 0.75, z: a.z * 0.25 + b.z * 0.75 }
          );
        }
        next.push(result[result.length - 1]);
        result = next;
      }
      return result;
    }

        const { GLTFLoader } = await withTimeout(

        referenceModelMesh.name = "trl01-nine-part-reference-model";
        referenceModelMaterial.opacity = 0.26;
        const records = trlPartRecords;
        const loaded = await Promise.all(records.map(async ([slot, source, matrix]) => {
          const url = new URL(`assets/trl01/parts/${source}?v=20260803-1`, window.location.href).href;
          const response = await withTimeout(fetch(url), modelLoadTimeoutMs, `${source} 下载超时`);
          if (!response.ok) throw new Error(`${source} 请求失败：${response.status}`);
          const buffer = await withTimeout(response.arrayBuffer(), modelLoadTimeoutMs, `${source} 读取超时`);
          const gltf = await withTimeout(new Promise((resolve, reject) => {
            loader.parse(buffer, "", resolve, reject);
          }), modelLoadTimeoutMs, `${slot} 解析超时`);
          const root = gltf.scene;
          root.name = slot;
          if (matrix) {
            root.matrixAutoUpdate = false;
            root.matrix.fromArray(matrix);
          }
          root.traverse((child) => {
            if (!child.isMesh) return;
            child.material = referenceModelMaterial;
            child.frustumCulled = false;
            child.renderOrder = 8;
            child.castShadow = false;
            child.receiveShadow = false;
          });
          trlPartMeshes.set(slot, root);
          return root;
        }));
        loaded.forEach((root) => referenceModelMesh.add(root));
        referenceModelMesh.visible = referenceModelVisible;
        scene.add(referenceModelMesh);
        return true;

          scene.remove(referenceModelMesh);
          referenceModelMesh = null;

    function numberValue(el, fallback) {

    function updateStlRangeWarning(count) {

    }

    function updateStlRangeVisualization() {
      if (!importedStlMesh) {
        stlOutOfRangeFaceCount = 0;
        updateStlRangeWarning(0);
        return;
      }

      importedStlMesh.updateMatrixWorld(true);
      const source = importedStlMesh.geometry.getAttribute("position");
      if (!source) return;
      let colors = importedStlMesh.geometry.getAttribute("color");
      if (!colors || colors.count !== source.count) {
        colors = new THREE.BufferAttribute(new Float32Array(source.count * 3), 3);
        importedStlMesh.geometry.setAttribute("color", colors);
      }

      const matrix = importedStlMesh.matrixWorld;
      const v = values();
      const a = new THREE.Vector3();
      const b = new THREE.Vector3();
      const c = new THREE.Vector3();
      const centroid = new THREE.Vector3();
      const triangleCount = Math.floor(source.count / 3);
      let outOfRangeFaces = 0;
      for (let i = 0; i < triangleCount; i += 1) {
        a.fromBufferAttribute(source, i * 3).applyMatrix4(matrix);
        b.fromBufferAttribute(source, i * 3 + 1).applyMatrix4(matrix);
        c.fromBufferAttribute(source, i * 3 + 2).applyMatrix4(matrix);
        centroid.copy(a).add(b).add(c).multiplyScalar(1 / 3);
        const faceInside = pointCheck(a, v).inside
          && pointCheck(b, v).inside
          && pointCheck(c, v).inside
          && pointCheck(centroid, v).inside;
        const color = faceInside ? stlValidColor : stlOutOfRangeColor;
        for (let vertex = 0; vertex < 3; vertex += 1) {
          colors.setXYZ(i * 3 + vertex, color.r, color.g, color.b);
        }
        if (!faceInside) outOfRangeFaces += 1;
      }
      colors.needsUpdate = true;
      stlOutOfRangeFaceCount = outOfRangeFaces;
      updateStlRangeWarning(outOfRangeFaces);
    }

    function updateStlIntersection() {

        setStlStatus("stlNoIntersection");
        return;

      stlIntersectionLines = new THREE.LineSegments(geometry, stlIntersectionMaterial);
      stlIntersectionLines.renderOrder = 30;
      scene.add(stlIntersectionLines);
      setStlStatus("stlIntersection", { count: count / 2 });
    }

    function clearStlIntersection() {
      if (!stlIntersectionLines) return;
      scene.remove(stlIntersectionLines);
      stlIntersectionLines.geometry.dispose();
      stlIntersectionLines = null;
    }

    function makeStlIntersectionGeometry() {
      const source = importedStlMesh.geometry.getAttribute("position");
      importedStlMesh.updateMatrixWorld(true);
      const matrix = importedStlMesh.matrixWorld;
      const v = values();
      const vertices = [];
      const a = new THREE.Vector3();
      const b = new THREE.Vector3();
      const c = new THREE.Vector3();
      const triangleCount = Math.floor(source.count / 3);
      const step = Math.max(1, Math.ceil(triangleCount / 60000));
      for (let i = 0; i < triangleCount; i += step) {
        a.fromBufferAttribute(source, i * 3).applyMatrix4(matrix);
        b.fromBufferAttribute(source, i * 3 + 1).applyMatrix4(matrix);
        c.fromBufferAttribute(source, i * 3 + 2).applyMatrix4(matrix);
        const crossings = [
          edgeIntersectionPoint(a, b, v),
          edgeIntersectionPoint(b, c, v),
          edgeIntersectionPoint(c, a, v)
        ].filter(Boolean);
        if (crossings.length >= 2) {
          vertices.push(crossings[0].x, crossings[0].y, crossings[0].z, crossings[1].x, crossings[1].y, crossings[1].z);
        }
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
      return geometry;
    }

    function edgeIntersectionPoint(a, b, v) {
      const aInside = pointCheck(a, v).inside;
      const bInside = pointCheck(b, v).inside;
      if (aInside === bInside) return null;
      let lo = a.clone();
      let hi = b.clone();
      let loInside = aInside;
      for (let i = 0; i < 10; i += 1) {
        const mid = lo.clone().lerp(hi, 0.5);
        const midInside = pointCheck(mid, v).inside;
        if (midInside === loInside) {
          lo = mid;
          loInside = midInside;
        } else {
          hi = mid;
        }
      }
      return lo.clone().lerp(hi, 0.5);
    }

    function withTimeout(promise, timeoutMs, message) {
      let timer = null;
      const timeout = new Promise((_, reject) => {
        timer = window.setTimeout(() => reject(new Error(message)), timeoutMs);
      });
      return Promise.race([promise, timeout]).finally(() => window.clearTimeout(timer));
    }

    function setNamedView(view) {

    async function loadWorkspaceEnvelope(profile) {
      if (workspaceMesh) {
        workspaceMesh.traverse((child) => {
          if (!child.isMesh) return;
          child.geometry.disposeBoundsTree?.();
          child.geometry.dispose();
        });
        scene.remove(workspaceMesh);
        workspaceMesh = null;
      }
      workspaceBoundaryMeshes = [];
      workspaceBounds = null;
      workspacePointCache.clear();
      const url = new URL("assets/trl01/envelope-v1-ypos-fullx-50mm-conservative.json?v=20260803-1", window.location.href).href;
      const response = await fetch(url);
      if (!response.ok) throw new Error(`TRL01 包络请求失败：${response.status}`);
      const asset = await response.json();
      if (asset.schema !== "trl01-tcp-envelope/v1" || asset.sampling?.resolutionMm !== 50) {
        throw new Error("TRL01 包络合同或分辨率不匹配");
      }
      const vertices = asset.boundaryMesh.vertices.flat();
      const triangles = asset.boundaryMesh.triangles.flat();
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
      geometry.setIndex(triangles);
      geometry.computeVertexNormals();
      geometry.computeBoundsTree({ maxLeafTris: 12 });
      workspaceMesh = new THREE.Mesh(geometry, workspaceMaterial);
      workspaceMesh.name = "TRL01 V1 50 mm conservative IK envelope";
      workspaceMesh.renderOrder = 3;
      workspaceMesh.castShadow = false;
      workspaceMesh.receiveShadow = false;
      workspaceBoundaryMeshes.push(workspaceMesh);
      window.__TRL01_ENVELOPE_ASSET__ = asset;
      scene.add(workspaceMesh);
      workspaceMesh.updateMatrixWorld(true);
      workspaceBounds = new THREE.Box3().setFromObject(workspaceMesh);
    }

    function makeDrawingWorkspaceGeometry(v) {
      const boundary = tjaCapsuleBoundary(160);
      const lobes = [
        clipPolygonAtY(boundary, tjaForbiddenBand.halfWidth, true),
        clipPolygonAtY(boundary, -tjaForbiddenBand.halfWidth, false)
      ].filter((polygon) => polygon.length >= 3);
      const vertices = [];
      const indices = [];
      for (const polygon of lobes) {
        const offset = vertices.length / 3;
        const count = polygon.length;
        for (const point of polygon) vertices.push(point.x, point.y, tjaRailLimits.zMin);
        for (const point of polygon) vertices.push(point.x, point.y, tjaRailLimits.zMax);
        for (let i = 0; i < count; i += 1) {
          const next = (i + 1) % count;
          addSideQuad(indices, offset + i, offset + next, offset + count + next, offset + count + i);
        }
        const triangles = THREE.ShapeUtils.triangulateShape(
          polygon.map((point) => new THREE.Vector2(point.x, point.y)),
          []
        );
        for (const [a, b, c] of triangles) {
          indices.push(offset + c, offset + b, offset + a);
          indices.push(offset + count + a, offset + count + b, offset + count + c);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    function clipPolygonAtY(points, threshold, keepAbove) {
      const inside = (point) => keepAbove ? point.y >= threshold : point.y <= threshold;
      const clipped = [];
      for (let i = 0; i < points.length; i += 1) {
        const current = points[i];
        const previous = points[(i + points.length - 1) % points.length];
        const currentInside = inside(current);
        const previousInside = inside(previous);
        if (currentInside !== previousInside) {
          const ratio = (threshold - previous.y) / (current.y - previous.y);
          clipped.push({
            x: THREE.MathUtils.lerp(previous.x, current.x, ratio),
            y: threshold
          });
        }
        if (currentInside) clipped.push({ ...current });
      }
      return clipped.filter((point, index) => {
        const previous = clipped[(index + clipped.length - 1) % clipped.length];
        return !previous || Math.hypot(point.x - previous.x, point.y - previous.y) > 0.001;
      });
    }

    function makeForbiddenBandBoundary() {
      const halfWidth = tjaForbiddenBand.halfWidth;
      const endReach = Math.sqrt(tjaRailLimits.radius ** 2 - halfWidth ** 2);
      const x0 = tjaRailLimits.min - endReach;
      const x1 = tjaRailLimits.max + endReach;
      const z0 = tjaRailLimits.zMin;
      const z1 = tjaRailLimits.zMax;
      const corners = [
        [x0, -halfWidth, z0], [x1, -halfWidth, z0], [x1, halfWidth, z0], [x0, halfWidth, z0],
        [x0, -halfWidth, z1], [x1, -halfWidth, z1], [x1, halfWidth, z1], [x0, halfWidth, z1]
      ];
      const edges = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
      const positions = [];
      for (const [a, b] of edges) positions.push(...corners[a], ...corners[b]);
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      const lines = new THREE.LineSegments(geometry, forbiddenBoundaryMaterial);
      lines.renderOrder = 4;
      return lines;
    }

    function tjaCapsuleBoundary(arcSteps = 160) {
      const points = [];
      const pushArc = (cx, start, end) => {
        for (let i = 0; i <= arcSteps; i += 1) {
          const angle = THREE.MathUtils.lerp(start, end, i / arcSteps);
          points.push({
            x: cx + tjaRailLimits.radius * Math.cos(angle),
            y: tjaRailLimits.radius * Math.sin(angle)
          });
        }
      };
      pushArc(tjaRailLimits.max, -Math.PI / 2, Math.PI / 2);
      points.push({ x: tjaRailLimits.min, y: tjaRailLimits.radius });
      pushArc(tjaRailLimits.min, Math.PI / 2, 3 * Math.PI / 2);
      points.push({ x: tjaRailLimits.max, y: -tjaRailLimits.radius });
      return points;
    }

    function addSideQuad(indices, a, b, c, d) {
      indices.push(a, b, d, b, c, d);
    }

    function measuredRadialRangeAtYaw(yaw, v) {
      const sin = Math.sin(yaw);
      const cos = Math.cos(yaw);
      const cy = v.innerCircleY;
      const discriminant = v.innerRadius * v.innerRadius - cy * cy * cos * cos;
      const forbiddenExit = discriminant < 0 ? measuredMinR : cy * sin + Math.sqrt(discriminant);
      const minR = Math.max(measuredMinR, forbiddenExit);
      const maxR = Math.min(v.outerRadius, measuredMaxR);
      return {
        min: Math.min(minR, maxR),
        max: Math.max(minR, maxR)
      };
    }

    function measuredRadialRangeAtYawAndZ(yaw, z, v) {
      const xyRange = measuredRadialRangeAtYaw(yaw, v);
      const rzRange = largestRzIntervalAtZ(z);
      if (!rzRange) {
        return { min: 0, max: 0 };
      }
      const min = Math.max(xyRange.min, rzRange.min);
      const max = Math.min(xyRange.max, rzRange.max);
      const mid = (min + max) / 2;
      return min <= max ? { min, max } : { min: mid, max: mid };
    }

    function largestRzIntervalAtZ(z) {
      const clampedZ = THREE.MathUtils.clamp(z, measuredMinZ + 0.001, measuredMaxZ - 0.001);
      const crossings = [];
      for (let i = 0; i < smoothRzProfile.length; i++) {
        const a = smoothRzProfile[i];
        const b = smoothRzProfile[(i + 1) % smoothRzProfile.length];
        if ((a.z <= clampedZ && b.z > clampedZ) || (b.z <= clampedZ && a.z > clampedZ)) {
          const t = (clampedZ - a.z) / (b.z - a.z);
          crossings.push(THREE.MathUtils.lerp(a.r, b.r, t));
        }
      }
      crossings.sort((a, b) => a - b);
      const unique = [];
      for (const r of crossings) {
        if (!unique.length || Math.abs(r - unique[unique.length - 1]) > 0.5) unique.push(r);
      }
      let best = null;
      for (let i = 0; i < unique.length - 1; i += 2) {
        const min = unique[i];
        const max = unique[i + 1];
        if (!best || max - min > best.max - best.min) best = { min, max };
      }
      return best;
    }

    function drawBox(v) {
      const geometry = new THREE.BoxGeometry(v.boxL, v.boxW, v.boxH);
      if (!boxMesh) {
        boxMesh = new THREE.Mesh(geometry, boxMaterial);
        boxMesh.castShadow = true;
        scene.add(boxMesh);
        boxEdges = new THREE.LineSegments(new THREE.EdgesGeometry(geometry), boxEdgeMaterial);
        scene.add(boxEdges);
      } else {
        boxMesh.geometry.dispose();
        boxMesh.geometry = geometry;
        boxEdges.geometry.dispose();
        boxEdges.geometry = new THREE.EdgesGeometry(geometry);
      }
      const yBounds = boxYBounds(v);
      boxMesh.position.set(v.boxX, (yBounds.min + yBounds.max) / 2, v.baseZ + v.boxH / 2);
      boxEdges.position.copy(boxMesh.position);
      boxMesh.material = isBoxInside(v).inside ? boxMaterial : boxBadMaterial;
      applyBoxVisibility();
    }

    function drawDimensions(v) {
      dimensionGroup.clear();

      const z0 = v.baseZ;
      const z1 = v.baseZ + v.boxH;
      const pad = isCamadaTheme ? Math.max(180, Math.min(v.boxL, v.boxW, v.boxH) * 0.16) : 44;
      const lLabelOffset = isCamadaTheme ? new THREE.Vector3(0, 780, 0) : new THREE.Vector3(0, 360, 0);
      const wLabelOffset = isCamadaTheme ? new THREE.Vector3(820, 0, 0) : new THREE.Vector3(360, 0, 0);
      const hLabelOffset = isCamadaTheme ? new THREE.Vector3(980, 860, 0) : new THREE.Vector3(420, 420, 0);

      addDimensionLine(
        new THREE.Vector3(x0, y1 + pad, z0),
        new THREE.Vector3(x1, y1 + pad, z0),
        isCamadaTheme ? `${fmt(v.boxL)} mm` : `L ${fmt(v.boxL)} mm`,
        lLabelOffset
      );
      addDimensionLine(
        new THREE.Vector3(x1 + pad, y0, z0),
        new THREE.Vector3(x1 + pad, y1, z0),
        isCamadaTheme ? `${fmt(v.boxW)} mm` : `W ${fmt(v.boxW)} mm`,
        wLabelOffset
      );
      addDimensionLine(
        new THREE.Vector3(x1 + pad, y1 + pad, z0),
        new THREE.Vector3(x1 + pad, y1 + pad, z1),
        isCamadaTheme ? `${fmt(v.boxH)} mm` : `H ${fmt(v.boxH)} mm`,
        hLabelOffset
      );

    function addDimensionLine(a, b, text, labelOffset = new THREE.Vector3()) {
      const isCamadaTheme = document.documentElement.dataset.theme === "camada";
      const color = isCamadaTheme ? 0x383838 : 0xf7f5f0;
      const radius = isCamadaTheme ? 5 : 18;
      const material = new THREE.MeshBasicMaterial({ color });
      dimensionGroup.add(cylinderBetween(a, b, radius, material));
      if (isCamadaTheme) {
        const delta = b.clone().sub(a);
        const tickDir = Math.abs(delta.z) > Math.max(Math.abs(delta.x), Math.abs(delta.y))
          ? new THREE.Vector3(1, 0, 0)
          : new THREE.Vector3(0, 0, 1);
        const tick = 190;
        [a, b].forEach((point) => {
          const t0 = point.clone().addScaledVector(tickDir, -tick / 2);
          const t1 = point.clone().addScaledVector(tickDir, tick / 2);
          dimensionGroup.add(cylinderBetween(t0, t1, 4, material));
        });
      }

      const mid = a.clone().add(b).multiplyScalar(0.5).add(labelOffset);
      const label = makeLabel(text, {
        scaleX: isCamadaTheme ? 1050 : 3136,
        scaleY: isCamadaTheme ? 260 : 882,
        fontSize: isCamadaTheme ? 200 : 120,
        background: 0,
        textColor: isCamadaTheme ? "#000000" : "#f7f5f0",
        fontWeight: isCamadaTheme ? 500 : 850,
        sizeAttenuation: true
      });
      label.position.copy(mid);
      dimensionGroup.add(label);
    }

    function applyBoxVisibility() {
      if (boxMesh) boxMesh.visible = boxVisible;
      if (boxEdges) boxEdges.visible = boxVisible;
      dimensionGroup.visible = boxVisible;
      boxHudItems.forEach((item) => { item.hidden = !boxVisible; });
    }

    function makeLabel(text, options = {}) {
      const fontSize = options.fontSize || 98;
      const background = options.background ?? 0.72;
      const c = document.createElement("canvas");
      c.width = 1024;
      c.height = 256;
      const ctx = c.getContext("2d");
      if (background > 0) {
        ctx.fillStyle = `rgba(56,51,48,${background})`;
        roundRect(ctx, 34, 38, 956, 180, 36);
        ctx.fill();
        ctx.strokeStyle = "rgba(247,245,240,0.18)";
        ctx.lineWidth = 5;
        ctx.stroke();
      }
      ctx.fillStyle = options.textColor || "#f7f5f0";
      ctx.font = `${options.fontWeight || 850} ${fontSize}px system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, 512, 128);
      const texture = new THREE.CanvasTexture(c);
      texture.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);
      const material = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthTest: false,
        sizeAttenuation: options.sizeAttenuation === true
      });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(options.scaleX || 0.132, options.scaleY || 0.036, 1);

    function makeGridLabel(text, position) {
      const c = document.createElement("canvas");
      c.width = 1024;
      c.height = 220;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "rgba(56,51,48,0.72)";
      roundRect(ctx, 24, 34, 976, 152, 28);
      ctx.fill();
      ctx.strokeStyle = "rgba(247,245,240,0.18)";
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.fillStyle = "#f7f5f0";
      ctx.font = "800 78px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, 512, 112);

      const texture = new THREE.CanvasTexture(c);
      const material = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        side: THREE.DoubleSide,

      });

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function updateLabels(v) {
      const result = isBoxInside(v);
      status.classList.toggle("invalid", !result.inside);
      status.classList.remove("warning");
      if (result.inside) {
        statusText.textContent = t("statusInside");
      } else if (result.reason === "forbiddenDevice") {
        statusText.textContent = t("statusForbidden");
      } else if (result.invalidSamples > 0) {
        statusText.textContent = t("statusOutside");
      } else {
        statusText.textContent = t("statusCorners", { count: 8 - result.validCorners });
      }
      metrics.l.textContent = fmt(v.boxL);
      metrics.w.textContent = fmt(v.boxW);
      metrics.h.textContent = fmt(v.boxH);
      volumeLabel.textContent = t("volume", { value: fmt((v.boxL * v.boxW * v.boxH) / 1000000) });
      cornerLabel.textContent = t("corners", { valid: result.validCorners });
    }

    function isBoxInside(v) {
      const corners = boxCorners(v);
      let validCorners = 0;
      let invalidSamples = 0;
      let clearance = Infinity;
      for (const p of corners) {
        const check = pointCheck(p, v);
        if (check.inside) validCorners += 1;
        clearance = Math.min(clearance, check.clearance);
      }
      for (const p of boxSamplePoints(v)) {
        const check = pointCheck(p, v);
        if (!check.inside) invalidSamples += 1;
        clearance = Math.min(clearance, check.clearance);
      }
      const forbiddenDevice = forbiddenDeviceCheck(v);
      clearance = Math.min(clearance, forbiddenDevice.clearance);
      return {
        inside: validCorners === 8
          && invalidSamples === 0
          && !forbiddenDevice.intersects,
        validCorners,
        invalidSamples,
        clearance,
        reason: forbiddenDevice.intersects
          ? "forbiddenDevice"
          : (invalidSamples > 0 ? "samples" : "corners")
      };
    }

    function forbiddenDeviceCheck(v) {
      const xMin = v.boxX - v.boxL / 2;
      const xMax = v.boxX + v.boxL / 2;
      const y = boxYBounds(v);
      const zMax = v.baseZ + v.boxH;
      const intersects = xMax >= trlDeviceExclusion.xMin
        && xMin <= trlDeviceExclusion.xMax
        && y.max >= trlDeviceExclusion.yMin
        && y.min <= trlDeviceExclusion.yMax
        && zMax >= trlDeviceExclusion.zMin;
      const separationX = Math.max(0, trlDeviceExclusion.xMin - xMax, xMin - trlDeviceExclusion.xMax);
      const separationY = Math.max(0, trlDeviceExclusion.yMin - y.max, y.min - trlDeviceExclusion.yMax);
      const clearance = intersects ? -1 : Math.hypot(separationX, separationY);
      return { intersects, clearance };
    }

    function pointCheck(p, v) {
      return drawingPointCheck(p, v);
    }

    function drawingPointCheck(p, v) {
      if (
        p.x < trlDomain.xMin || p.x > trlDomain.xMax
        || p.y < trlDomain.yMin || p.y > trlDomain.yMax
        || p.z < trlDomain.zMin || p.z > trlDomain.zMax
      ) return { inside: false, clearance: -50 };
      if (
        p.x >= trlDeviceExclusion.xMin && p.x <= trlDeviceExclusion.xMax
        && p.y >= trlDeviceExclusion.yMin && p.y <= trlDeviceExclusion.yMax
        && p.z >= trlDeviceExclusion.zMin
      ) return { inside: false, clearance: -50 };
      const insideFinalEnvelope = pointInsideFinalEnvelope(p);
      return {
        inside: insideFinalEnvelope,
        clearance: insideFinalEnvelope ? 50 : -50
      };
    }

    function pointInsideFinalEnvelope(point) {
      if (!workspaceBounds || workspaceBoundaryMeshes.length === 0) return false;
      const query = point.clone();
      if (query.z >= trlDomain.zMin && query.z < workspaceBounds.min.z + 2) {
        query.z = workspaceBounds.min.z + 2;
      }
      if (
        query.x < workspaceBounds.min.x || query.x > workspaceBounds.max.x
        || query.y < workspaceBounds.min.y || query.y > workspaceBounds.max.y
        || query.z < workspaceBounds.min.z || query.z > workspaceBounds.max.z
      ) return false;

      const cacheKey = `${activeNozzleProfile}:${query.x.toFixed(2)}:${query.y.toFixed(2)}:${query.z.toFixed(2)}`;
      if (workspacePointCache.has(cacheKey)) return workspacePointCache.get(cacheKey);

      workspaceRaycaster.ray.origin.copy(query);
      workspaceRaycaster.ray.direction.copy(workspaceRayDirection);
      workspaceRaycaster.near = 0.01;
      workspaceRaycaster.far = Infinity;
      const intersections = workspaceRaycaster.intersectObjects(workspaceBoundaryMeshes, false);
      let uniqueIntersections = 0;
      let lastDistance = -Infinity;
      for (const hit of intersections) {
        if (hit.distance - lastDistance <= 0.05) continue;
        uniqueIntersections += 1;
        lastDistance = hit.distance;
      }
      const inside = uniqueIntersections % 2 === 1;
      workspacePointCache.set(cacheKey, inside);
      return inside;
    }

    function axisCell(axis, value) {
      if (value < axis[0] - 0.001 || value > axis[axis.length - 1] + 0.001) return null;
      const spacing = axis[1] - axis[0];
      const position = (value - axis[0]) / spacing;
      const low = Math.max(0, Math.min(axis.length - 1, Math.floor(position + 1e-8)));
      const high = Math.max(0, Math.min(axis.length - 1, Math.ceil(position - 1e-8)));
      return low === high ? [low] : [low, high];
    }

    function templateCellReachable(profile, kind, horizontal, z) {
      const zAxis = profile.z.slice(1);
      const zIndices = axisCell(zAxis, z);
      const horizontalAxis = kind === "rail" ? profile.railY : profile.r;
      const horizontalIndices = axisCell(horizontalAxis, horizontal);
      if (!zIndices || !horizontalIndices) return false;
      const rowLength = horizontalAxis.length;
      const values = kind === "rail" ? profile.rail : profile.outside;
      return zIndices.every((zIndex) => horizontalIndices.every((hIndex) => (
        values[(zIndex + 1) * rowLength + hIndex] === 1
      )));
    }

    function distancePointToSegment(px, py, ax, ay, bx, by) {
      const dx = bx - ax;
      const dy = by - ay;
      const len2 = dx * dx + dy * dy;
      const t = len2 <= 0 ? 0 : THREE.MathUtils.clamp(((px - ax) * dx + (py - ay) * dy) / len2, 0, 1);
      return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
    }

    function boxCorners(v) {
      const xs = [v.boxX - v.boxL / 2, v.boxX + v.boxL / 2];
      const yBounds = boxYBounds(v);
      const ys = [yBounds.min, yBounds.max];
      const zs = [v.baseZ, v.baseZ + v.boxH];
      const corners = [];
      for (const x of xs) for (const y of ys) for (const z of zs) corners.push(new THREE.Vector3(x, y, z));
      return corners;
    }

    function boxSamplePoints(v) {
      const xs = sampleRangeBySpacing(v.boxX - v.boxL / 2, v.boxX + v.boxL / 2);
      const yBounds = boxYBounds(v);
      const ys = sampleRangeBySpacing(yBounds.min, yBounds.max);
      const zs = sampleRangeBySpacing(v.baseZ, v.baseZ + v.boxH);
      const points = [];
      for (const x of xs) for (const y of ys) {
        points.push(new THREE.Vector3(x, y, v.baseZ));
        points.push(new THREE.Vector3(x, y, v.baseZ + v.boxH));
      }
      for (const z of zs) {
        for (const x of xs) {
          points.push(new THREE.Vector3(x, yBounds.min, z));
          points.push(new THREE.Vector3(x, yBounds.max, z));
        }
        for (const y of ys) {
          points.push(new THREE.Vector3(v.boxX - v.boxL / 2, y, z));
          points.push(new THREE.Vector3(v.boxX + v.boxL / 2, y, z));
        }
      }
      return points;
    }

    function boxYBounds(v) {
      return { min: v.boxY, max: v.boxY + v.boxW };
    }

    function sampleRange(min, max, count) {
      if (count <= 1) return [(min + max) / 2];
      return Array.from({ length: count }, (_, i) => THREE.MathUtils.lerp(min, max, i / (count - 1)));
    }

    function sampleRangeBySpacing(min, max) {
      const count = Math.max(2, Math.min(72, Math.ceil(Math.abs(max - min) / 100) + 1));
      return sampleRange(min, max, count);
    }

    function positiveInnerY(v) {
      return Math.ceil(v.innerCircleY + v.innerRadius);
    }

    function negativeInnerY(v) {
      return Math.floor(v.innerCircleY - v.innerRadius);
    }

    function fitBox() {
      const v = values();
      fitDrawingBox(v, fitMode);
    }

    function moveFitStartOutward(v, mode) {
      const fixedId = mode === "W" ? "boxW" : mode === "H" ? "boxH" : "boxL";
      const freeIds = ["boxL", "boxW", "boxH"].filter((id) => id !== fixedId);
      const startY = Math.ceil(v.boxY / 10) * 10;
      const maxY = Math.floor(Number(input.boxY.max) / 10) * 10;
      const minimums = Object.fromEntries(freeIds.map((id) => [id, Number(input[id].min)]));

      for (let y = startY; y <= maxY; y += 10) {
        if (!isCandidateInside(v, { boxY: y, ...minimums })) continue;
        input.boxY.value = y;
        v.boxY = y;
        return true;
      }
      return false;
    }

    function fitDrawingBox(v, mode) {
      if (!moveFitStartOutward(v, mode)) return;

      const maxL = Number(input.boxL.max);
      const maxW = Number(input.boxW.max);
      const maxH = Number(input.boxH.max);
      const maximize = (targetId, maximum, fixed = {}) => {
        let low = 10;
        let high = Math.floor(maximum / 10) * 10;
        let best = isCandidateInside(v, { ...fixed, [targetId]: low }) ? low : 0;
        while (low <= high) {
          const mid = Math.floor((low + high) / 20) * 10;
          if (isCandidateInside(v, { ...fixed, [targetId]: mid })) {
            best = mid;
            low = mid + 10;
          } else {
            high = mid - 10;
          }
        }
        return best;
      };

      if (mode === "L") {
        const fittedW = maximize("boxW", maxW, { boxL: v.boxL, boxH: 10 });
        input.boxW.value = Math.max(10, fittedW);
        input.boxH.value = Math.max(10, maximize("boxH", maxH, { boxL: v.boxL, boxW: Number(input.boxW.value) }));
      } else if (mode === "W") {
        const fittedL = maximize("boxL", maxL, { boxW: v.boxW, boxH: 10 });
        input.boxL.value = Math.max(10, fittedL);
        input.boxH.value = Math.max(10, maximize("boxH", maxH, { boxL: Number(input.boxL.value), boxW: v.boxW }));
      } else {
        let best = null;
        for (let width = 10; width <= maxW; width += 50) {
          const length = maximize("boxL", maxL, { boxW: width, boxH: v.boxH });
          if (length < 10) continue;
          const area = length * width;
          if (!best || area > best.area || (area === best.area && length > best.length)) {
            best = { length, width, area };
          }
        }
        const fitted = best || { length: 10, width: 10 };
        input.boxL.value = fitted.length;
        input.boxW.value = fitted.width;
      }

      if (!isBoxInside(values()).inside) {
        const fixedId = mode === "W" ? "boxW" : mode === "H" ? "boxH" : "boxL";
        for (const id of ["boxL", "boxW", "boxH"]) {
          if (id !== fixedId) input[id].value = Number(input[id].min);
        }
      }
    }

    function fitPrimaryThenSecondary(base, config, boundaryY) {
      const fixed = { boxY: boundaryY, [config.a]: config.aMin, [config.b]: config.bMin };
      if (!isCandidateInside(base, fixed)) {
        input.boxY.value = boundaryY;
        applyFitPairValues(base, config, config.aMin, config.bMin);
        return;
      }

      const primary = maximizeCandidateValue(base, config.a, config.aMin, config.aMax, {
        boxY: boundaryY,
        [config.b]: config.bMin
      });
      const fixedPrimary = Math.max(config.aMin, Math.floor((primary || config.aMin) / 10) * 10);
      const secondary = maximizeCandidateValue(base, config.b, config.bMin, config.bMax, {
        boxY: boundaryY,
        [config.a]: fixedPrimary
      });
      const fixedSecondary = Math.max(config.bMin, Math.floor((secondary || config.bMin) / 10) * 10);

      input.boxY.value = boundaryY;
      applyFitPairValues(base, config, fixedPrimary, fixedSecondary);
    }

    function fitHeightBySearchingY(base, config, boundaryY) {
      const radialLimits = radialLimitsForHeight(base.baseZ, base.baseZ + base.boxH);
      if (!radialLimits) {
        input.boxY.value = boundaryY;
        applyFitPairValues(base, config, config.aMin, config.bMin);
        return;
      }

      const radialMin = Math.max(0, radialLimits.min);
      const radialMax = Math.min(radialLimits.max, base.outerRadius);
      const yMin = base.boxY < 0 ? boundaryY : Math.max(boundaryY, Math.floor(Math.max(radialMin, base.innerCircleY + base.innerRadius) / 10) * 10);
      const yMax = base.boxY < 0 ? boundaryY : Math.min(base.outerRadius - 10, Math.ceil(radialMax / 10) * 10);

      let best = searchFixedHeightFootprint(base, config, yMin, yMax, radialMin, radialMax, 160, 160);
      if (best) {
        best = searchFixedHeightFootprint(
          base,
          config,
          Math.max(yMin, best.y - 220),
          Math.min(yMax, best.y + 220),
          radialMin,
          radialMax,
          20,
          20,
          Math.max(config.bMin, best.secondary - 360),
          Math.min(config.bMax, best.secondary + 360)
        ) || best;
      }

      if (!best) {
        input.boxY.value = boundaryY;
        applyFitPairValues(base, config, config.aMin, config.bMin);
        return;
      }

      input.boxY.value = best.y;
      applyFitPairValues(base, config, best.primary, best.secondary);
    }

    function searchFixedHeightFootprint(base, config, yMin, yMax, radialMin, radialMax, yStep, secondaryStep, secondaryMin = config.bMin, secondaryMax = config.bMax) {
      let best = null;
      const searchYMin = base.boxY < 0 ? yMin : Math.max(yMin, radialMin);
      const searchYMax = base.boxY < 0 ? yMax : Math.min(yMax, radialMax - config.bMin);

      for (const y of steppedValues(searchYMin, searchYMax, yStep)) {
        const nearYAbs = Math.abs(y);
        if (nearYAbs < radialMin - 0.001) continue;

        const maxSecondaryAtY = y < 0
          ? Math.min(secondaryMax, Math.abs(y) - radialMin, radialMax + y)
          : Math.min(secondaryMax, radialMax - y);
        if (maxSecondaryAtY < config.bMin) continue;

        input.boxY.value = y;
        for (const secondaryCandidate of steppedValues(secondaryMin, maxSecondaryAtY, secondaryStep)) {
          const fixedSecondary = Math.max(config.bMin, Math.min(config.bMax, Math.floor(secondaryCandidate / 10) * 10));
          const farY = y < 0 ? y - fixedSecondary : y + fixedSecondary;
          const farYAbs = Math.abs(farY);
          if (farYAbs > radialMax) continue;

          const maxHalfLength = Math.sqrt(Math.max(0, radialMax * radialMax - farYAbs * farYAbs));
          const primaryLimit = Math.max(config.aMin, Math.min(config.aMax, Math.floor((maxHalfLength * 2) / 10) * 10));
          const fixedPrimary = largestValidPrimaryForSecondary(base, config, y, primaryLimit, fixedSecondary, Math.max(10, yStep));
          if (!fixedPrimary) continue;

          const area = fixedPrimary * fixedSecondary;
          if (
            !best
            || area > best.area
            || (area === best.area && fixedPrimary > best.primary)
            || (area === best.area && fixedPrimary === best.primary && fixedSecondary > best.secondary)
          ) {
            best = { y, primary: fixedPrimary, secondary: fixedSecondary, area };
          }
        }
      }
      return best;
    }

    function largestValidPrimaryForSecondary(base, config, y, primaryLimit, fixedSecondary, step) {
      const start = Math.floor(primaryLimit / 10) * 10;
      for (let primary = start; primary >= config.aMin; primary -= step) {
        const fixedPrimary = Math.max(config.aMin, Math.floor(primary / 10) * 10);
        if (isCandidateInside(base, { boxY: y, [config.a]: fixedPrimary, [config.b]: fixedSecondary })) return fixedPrimary;
      }
      return isCandidateInside(base, { boxY: y, [config.a]: config.aMin, [config.b]: fixedSecondary }) ? config.aMin : null;
    }

    function isCandidateInside(base, overrides = {}) {
      return isBoxInside({ ...base, ...overrides, boxZ: 0 }).inside;
    }

    function maximizeCandidateValue(base, targetId, minValue, maxValue, fixed = {}) {
      let lo = minValue;
      let hi = maxValue;
      if (!isCandidateInside(base, { ...fixed, [targetId]: lo })) return null;
      if (isCandidateInside(base, { ...fixed, [targetId]: hi })) return hi;
      for (let i = 0; i < 24; i++) {
        const mid = (lo + hi) / 2;
        if (isCandidateInside(base, { ...fixed, [targetId]: mid })) lo = mid;
        else hi = mid;
      }
      return lo;
    }

    function radialLimitsForHeight(zMin, zMax) {
      const sampleCount = 36;
      const zValues = Array.from({ length: sampleCount }, (_, i) => (
        THREE.MathUtils.lerp(zMin, zMax, i / (sampleCount - 1))
      ));
      let min = -Infinity;
      let max = Infinity;
      for (const z of zValues) {
        const interval = largestRzIntervalAtZ(z);
        if (!interval) return null;
        min = Math.max(min, interval.min);
        max = Math.min(max, interval.max);
      }
      return min <= max ? { min, max } : null;
    }

    function steppedValues(min, max, step) {
      const values = [];
      const start = Math.ceil(min / 10) * 10;
      const end = Math.floor(max / 10) * 10;
      for (let value = start; value <= end; value += step) values.push(value);
      if (!values.includes(end)) values.push(end);
      return values;
    }

    function searchPrimarySecondaryY(base, config, yMin, yMax, yStep) {
      let best = null;
      for (let y = yMin; y <= yMax; y += yStep) {
        input.boxY.value = y;
        applyFitPairValues(base, config, config.aMin, config.bMin);
        if (!isBoxInside(values()).inside) continue;

        const primary = maximizeFitValue(base, config, config.a, config.aMin, config.aMax, config.b, config.bMin);
        const fixedPrimary = Math.max(config.aMin, Math.floor(primary / 10) * 10);
        const secondary = maximizeFitValue(base, config, config.b, config.bMin, config.bMax, config.a, fixedPrimary);
        const fixedSecondary = Math.max(config.bMin, Math.floor(secondary / 10) * 10);
        if (!best || fixedPrimary > best.primary || (fixedPrimary === best.primary && fixedSecondary > best.secondary)) {
          best = { y, primary: fixedPrimary, secondary: fixedSecondary };
        }
      }
      return best;
    }

    function maximizeFitValue(base, config, targetId, minValue, maxValue, otherId, otherValue) {
      let lo = minValue;
      let hi = maxValue;
      applyTwoValueCandidate(base, targetId, hi, otherId, otherValue);
      if (isBoxInside(values()).inside) return hi;
      for (let i = 0; i < 24; i++) {
        const mid = (lo + hi) / 2;
        applyTwoValueCandidate(base, targetId, mid, otherId, otherValue);
        if (isBoxInside(values()).inside) lo = mid;
        else hi = mid;
      }
      return lo;
    }

    function applyTwoValueCandidate(base, targetId, targetValue, otherId, otherValue) {
      input.boxL.value = base.boxL;
      input.boxW.value = base.boxW;
      input.boxH.value = base.boxH;
      input[targetId].value = targetValue;
      input[otherId].value = otherValue;
    }

    function applyFitPairValues(base, config, aValue, bValue) {
      input.boxL.value = base.boxL;
      input.boxW.value = base.boxW;
      input.boxH.value = base.boxH;
      input[config.a].value = aValue;
      input[config.b].value = bValue;
    }

    function fitConfigForMode(mode) {
      const fixed = mode === "W" ? "boxW" : mode === "H" ? "boxH" : "boxL";
      const variables = ["boxL", "boxW", "boxH"].filter((id) => id !== fixed);
      return {
        fixed,
        a: variables[0],
        b: variables[1],
        aMin: Number(input[variables[0]].min),
        aMax: Number(input[variables[0]].max),
        bMin: Number(input[variables[1]].min),
        bMax: Number(input[variables[1]].max)
      };
    }

    function fitFreeRatio(base, config) {
      const maxFree = Math.max(1, base[config.a], base[config.b]);
      return {
        a: Math.max(0.001, base[config.a] / maxFree),
        b: Math.max(0.001, base[config.b] / maxFree)
      };
    }

    function searchFitPairScale(base, config, ratio, yMin, yMax, yStep, minScale, maxScale) {
      let best = null;
      for (let y = yMin; y <= yMax; y += yStep) {
        input.boxY.value = y;
        applyFitPairScale(base, config, ratio, minScale);
        if (!isBoxInside(values()).inside) continue;

        let lo = minScale;
        let hi = maxScale;
        applyFitPairScale(base, config, ratio, hi);
        if (isBoxInside(values()).inside) lo = hi;

        for (let i = 0; i < 20; i++) {
          const mid = (lo + hi) / 2;
          applyFitPairScale(base, config, ratio, mid);
          if (isBoxInside(values()).inside) lo = mid;
          else hi = mid;
        }

        const score = (lo * ratio.a) * (lo * ratio.b);
        if (!best || score > best.score) {
          best = { y, scale: lo, score };
        }
      }
      return best;
    }

    function applyFitPairScale(base, config, ratio, scale) {
      input.boxL.value = base.boxL;
      input.boxW.value = base.boxW;
      input.boxH.value = base.boxH;
      input[config.a].value = scale * ratio.a;
      input[config.b].value = scale * ratio.b;
    }

    function shrinkFitPairUntilInside(config) {
      let guard = 0;
      while (!isBoxInside(values()).inside && guard < 60) {
        input[config.a].value = Math.max(Number(input[config.a].min), Math.floor(Number(input[config.a].value) * 0.98 / 10) * 10);
        input[config.b].value = Math.max(Number(input[config.b].min), Math.floor(Number(input[config.b].value) * 0.98 / 10) * 10);
        guard += 1;
      }
    }

    function shrinkSecondaryUntilInside(config) {
      let guard = 0;
      while (!isBoxInside(values()).inside && guard < 60) {
        input[config.b].value = Math.max(Number(input[config.b].min), Math.floor(Number(input[config.b].value) * 0.98 / 10) * 10);
        guard += 1;
      }
    }

    function measuredPeakHeight() {
      return smoothRzProfile.reduce((max, p) => Math.max(max, p.z), 0);
    }

    function syncRanges() {
      document.querySelectorAll("input[type='range'][data-for]").forEach((range) => {
        range.value = document.getElementById(range.dataset.for).value;
      });
    }

    function axisArrow(start, end, color, label) {
      const group = new THREE.Group();
      const dir = end.clone().sub(start);
      const material = new THREE.MeshBasicMaterial({ color });
      group.add(cylinderBetween(start, end, 34, material));
      const cone = new THREE.ConeGeometry(145, 390, 28);
      const coneMesh = new THREE.Mesh(cone, material);
      coneMesh.position.copy(end);
      coneMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
      group.add(coneMesh);
      const sprite = makeLabel(label, { scaleX: 0.14, scaleY: 0.04, fontSize: 126, background: 0 });
      sprite.position.copy(start.clone().addScaledVector(dir, 1.06));
      group.add(sprite);
      return group;
    }

    function addCylinderLine(group, start, end, material, radius) {
      group.add(cylinderBetween(start, end, radius, material));
    }

    function cylinderBetween(start, end, radius, material) {
      const dir = end.clone().sub(start);
      const geometry = new THREE.CylinderGeometry(radius, radius, dir.length(), 18);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
      return mesh;
    }

    function fmt(n) {
      return Number(n).toLocaleString("zh-CN", { maximumFractionDigits: n < 20 ? 1 : 0 });
    }

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      renderer.setSize(rect.width, rect.height, false);
      camera.aspect = rect.width / rect.height;
      camera.updateProjectionMatrix();
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
